plugins {
    id 'com.android.library'
}

android {
    compileSdkVersion 31

    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 31
        versionCode 1
        versionName "1.3.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        
        // MODIFIED: 显式启用 16KB 支持
        manifestPlaceholders = [android_16k_page_enabled: "true"]
    }

    // MODIFIED: 尝试提升 NDK 版本
    // 如果 CI 环境中有 NDK 25，它会尝试使用。
    // 如果没有，它会回退到默认路径，但可能无法生成 16KB 对齐。
    android.ndkVersion "25.2.9519653"

    buildTypes {
        release {
            buildConfigField("String", "VERSION_NAME", "\"${defaultConfig.versionName}\"")
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            buildConfigField("String", "VERSION_NAME", "\"${defaultConfig.versionName}\"")
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        textReport true
        abortOnError false
        warningsAsErrors true
    }
}

apply plugin: 'org.mozilla.rust-android-gradle.rust-android'

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'commons-io:commons-io:2.11.0'
    implementation 'androidx.annotation:annotation:1.6.0'
}

cargo {
    module = "../../../../core/api"
    targetDirectory = "../../../../target"
    libname = "lofelt_sdk"
    targets = ["arm", "x86", "arm64", "x86_64"]
    verbose = true
    apiLevel = 26
    
    // MODIFIED: 判断构建类型的逻辑 (更安全)
    def isDebug = gradle.startParameter.taskNames.any { it.toLowerCase().contains("debug") }
    profile = isDebug ? "debug" : "release"

    // MODIFIED: 核心修复 - 16KB 对齐参数
    // 旧版插件不支持 'rustFlags' 属性，我们需要将参数拼接到 'extraCargoBuildArgs' 中
    // 或者直接通过环境变量指定 RUSTFLAGS
    
    // 1. 构建 Rust 标志字符串
    def pageAlignFlags = "-C link-arg=-Wl,-z,max-page-size=0x4000 -C link-arg=-Wl,-z,common-page-size=0x4000"
    
    // 2. 设置为环境变量 (这是最可靠的方法，绕过 Gradle 插件的解析)
    System.setProperty("org.gradle.project.cargoRustflags", pageAlignFlags)
    
    // 3. 尝试添加到参数列表 (兼容部分插件版本)
    extraCargoBuildArgs = ["--verbose"]
}

// MODIFIED: 强制指定 NDK 路径给 Cargo
// 如果你的 CI 环境中已经下载了 NDK 25，这里手动指定它
afterEvaluate {
    // 这是一个 Hack，强制告诉 Rust 编译器去哪里找 Android 的 NDK
    // 请根据你的实际 Runner 环境修改路径，或者使用环境变量 ANDROID_NDK_HOME
    // 
    // 假设 NDK 安装在默认的 SDK 路径下:
    // def ndkPath = System.getenv("ANDROID_NDK_HOME")
    // if (ndkPath == null) {
    //     ndkPath = "/Users/runner/Library/Android/sdk/ndk/25.2.9519653" 
    // }
    // 
    // 如果你能确认 NDK 25 的绝对路径，取消下面几行的注释:
    // tasks.withType(com.nishtahir.CargoTask) {
    //     environment("NDK_HOME", ndkPath)
    //     environment("ANDROID_NDK", ndkPath)
    // }
}

android.libraryVariants.all { variant ->
    if (variant.name == 'release') {
        project.tasks.create("generateJavadoc", Javadoc) {
            group "Build"
            description "Generate API documentation with Javadoc"
            failOnError true

            doFirst {
                classpath = project.files(variant.javaCompileProvider.get().classpath.files,
                        project.android.getBootClasspath())
            }

            destinationDir = file("../javadoc/")
            source = variant.sourceSets.collect { sourceSet -> sourceSet.java.sourceFiles }
                    .inject { acc, val -> acc + val }

            options.addStringOption('Xdoclint:all', '-Xwerror')
            options.windowTitle = "Lofelt Studio SDK"
            options.memberLevel = JavadocMemberLevel.PROTECTED
            options.links("https://developer.android.com/reference/")

            options.noDeprecatedList()
            options.noHelp()
            options.noIndex()
            options.noTree()

            def currentJavaVersion = JavaVersion.current()
            if (currentJavaVersion >= JavaVersion.VERSION_1_9) {
                options.addStringOption("-release", "8")
            }
        }
    }
}

afterEvaluate {
    android.libraryVariants.all { variant ->
        def productFlavor = ""
        variant.productFlavors.each {
            productFlavor += "${it.name.capitalize()}"
        }
        def buildType = "${variant.buildType.name.capitalize()}"
        tasks["generate${productFlavor}${buildType}Assets"].dependsOn(tasks["cargoBuild"])
    }
}
