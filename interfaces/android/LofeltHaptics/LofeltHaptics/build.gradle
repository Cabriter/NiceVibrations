plugins {
    id 'com.android.library'
}

android {
    compileSdkVersion 31

    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 31

        versionCode 1
        versionName "1.3.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        // MODIFIED: 显式启用 16KB 页面对齐 (安全选项)
        // 虽然对于纯 Rust 库，这通常由 Cargo 控制，但开启它可以确保构建系统知道意图
        manifestPlaceholders = [android_16k_page_enabled: "true"]
    }

    // MODIFIED: NDK 版本是关键！
    // NDK 21 不支持 16KB 输出。必须升级到 23 或更高 (推荐 25/26)
    android.ndkVersion "25.2.9519653" 

    buildTypes {
        release {
            buildConfigField("String", "VERSION_NAME", "\"${defaultConfig.versionName}\"")
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            buildConfigField("String", "VERSION_NAME", "\"${defaultConfig.versionName}\"")
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        textReport true
        abortOnError false
        warningsAsErrors true
    }
}

// MODIFIED: 建议更新 Rust 插件版本，或者确保你的环境支持它
apply plugin: 'org.mozilla.rust-android-gradle.rust-android'

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'commons-io:commons-io:2.11.0'
    implementation 'androidx.annotation:annotation:1.6.0'
}

cargo {
    module = "../../../../core/api"
    targetDirectory = "../../../../target"
    libname = "lofelt_sdk"
    targets = ["arm", "x86", "arm64", "x86_64"]
    verbose = true
    apiLevel = 26
    
    // MODIFIED: 根据 buildType 设置 profile
    // 修正了原逻辑可能存在的潜在错误
    profile = gradle.startParameter.taskNames.any { it.toLowerCase().contains("debug") } ? "debug" : "release"

    // ============================================================
    // ⭐ 最关键修改：强制 Rust 生成 16KB 对齐的二进制文件 ⭐
    // ============================================================
    // Rust 编译器需要明确的标志来对齐 .text 和 .data 段。
    // 0x4000 = 16384 = 16KB
    rustFlagsWithDebug = "-C link-arg=-Wl,-z,max-page-size=0x4000 -C link-arg=-Wl,-z,common-page-size=0x4000"
    rustFlagsRelease = "-C link-arg=-Wl,-z,max-page-size=0x4000 -C link-arg=-Wl,-z,common-page-size=0x4000"
    
    // 应用这些标志
    rustFlags = profile == "debug" ? rustFlagsWithDebug : rustFlagsRelease
}

// (保留原有的 Javadoc 和 Variant 逻辑)
android.libraryVariants.all { variant ->
    if (variant.name == 'release') {
        project.tasks.create("generateJavadoc", Javadoc) {
            group "Build"
            description "Generate API documentation with Javadoc"
            failOnError true

            doFirst {
                classpath = project.files(variant.javaCompileProvider.get().classpath.files,
                        project.android.getBootClasspath())
            }

            destinationDir = file("../javadoc/")
            source = variant.sourceSets.collect { sourceSet -> sourceSet.java.sourceFiles }
                    .inject { acc, val -> acc + val }

            options.addStringOption('Xdoclint:all', '-Xwerror')
            options.windowTitle = "Lofelt Studio SDK"
            options.memberLevel = JavadocMemberLevel.PROTECTED
            options.links("https://developer.android.com/reference/")

            options.noDeprecatedList()
            options.noHelp()
            options.noIndex()
            options.noTree()

            def currentJavaVersion = JavaVersion.current()
            if (currentJavaVersion >= JavaVersion.VERSION_1_9) {
                options.addStringOption("-release", "8")
            }
        }
    }
}

afterEvaluate {
    android.libraryVariants.all { variant ->
        def productFlavor = ""
        variant.productFlavors.each {
            productFlavor += "${it.name.capitalize()}"
        }
        def buildType = "${variant.buildType.name.capitalize()}"
        tasks["generate${productFlavor}${buildType}Assets"].dependsOn(tasks["cargoBuild"])
    }
}
